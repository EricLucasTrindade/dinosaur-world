# Ambiente local de desenvolvimento — apenas o banco.
#
#   docker compose up -d
#   docker compose down          (mantém os dados)
#   docker compose down -v       (apaga o volume/dados e o seed será recarregado)

services:
  postgres:
    image: postgres:16-alpine
    container_name: dinosaurworld-postgres
    environment:
      POSTGRES_DB: dinosaurworld
      POSTGRES_USER: dinosaurworld
      POSTGRES_PASSWORD: dinosaurworld
    # Host usa 5545 para não colidir com o Postgres nativo (5432)
    # nem com o container do viagem-legal (5544).
    ports:
      - "5545:5432"
    volumes:
      - dinosaurworld-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dinosaurworld -d dinosaurworld"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dinosaurworld-pgdata:
